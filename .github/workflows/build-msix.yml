name: Build MSIX Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version Number (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

env:
  PROJECT_PATH: 'KaiROS.AI.WinUI/KaiROS.AI.WinUI.csproj'
  MANIFEST_PATH: 'KaiROS.AI.WinUI/Package.appxmanifest'

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Update Version
      shell: pwsh
      run: |
        $version = "${{ github.event.inputs.version }}"
        $appxVersion = "$version.0"

        # Update csproj
        $csproj = Get-Content "${{ env.PROJECT_PATH }}"
        $csproj = $csproj -replace '<Version>.*</Version>', "<Version>$version</Version>"
        $csproj = $csproj -replace '<AssemblyVersion>.*</AssemblyVersion>', "<AssemblyVersion>$appxVersion</AssemblyVersion>"
        $csproj = $csproj -replace '<FileVersion>.*</FileVersion>', "<FileVersion>$appxVersion</FileVersion>"
        $csproj | Set-Content "${{ env.PROJECT_PATH }}"

        # Update Package.appxmanifest (requires 4-part version x.x.x.x)
        [xml]$manifest = Get-Content "${{ env.MANIFEST_PATH }}"
        $manifest.Package.Identity.Version = $appxVersion
        $manifest.Save((Resolve-Path "${{ env.MANIFEST_PATH }}"))

    - name: Decode PFX Certificate
      shell: pwsh
      run: |
        $pfx_cert_byte = [System.Convert]::FromBase64String("${{ secrets.PFX_BASE64 }}")
        [IO.File]::WriteAllBytes("KaiROS.AI.WinUI/KaiROS_CI.pfx", $pfx_cert_byte)

    - name: Restore Dependencies
      run: dotnet restore "${{ env.PROJECT_PATH }}"

    - name: Build MSIX Store Package
      shell: pwsh
      run: |
        msbuild "${{ env.PROJECT_PATH }}" `
          /restore `
          /p:Configuration=Release `
          /p:Platform=x64 `
          /p:GenerateAppxPackageOnBuild=true `
          /p:UapAppxPackageBuildMode=StoreUpload `
          /p:AppxBundle=Always `
          /p:AppxBundlePlatforms="x86|x64|ARM64" `
          /p:AppxPackageSigningEnabled=true `
          /p:GenerateTemporaryStoreCertificate=false `
          /p:PackageCertificateKeyFile="KaiROS.AI.WinUI/KaiROS_CI.pfx" `
          /p:PackageCertificatePassword="${{ secrets.PFX_PASSWORD }}"

    - name: Collect Artifacts
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Name artifacts -Force
        $version = "${{ github.event.inputs.version }}"

        $msixUpload = Get-ChildItem -Path "KaiROS.AI.WinUI/AppPackages" -Recurse -Filter "*.msixupload" | Select-Object -First 1
        if ($msixUpload) {
          Copy-Item $msixUpload.FullName "artifacts/KaiROS-v$version.msixupload"
          Write-Host "Packaged: $($msixUpload.Name)"
        } else {
          Write-Error "No .msixupload file found in KaiROS.AI.WinUI/AppPackages/"
          exit 1
        }

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: KaiROS-Store-Package
        path: artifacts/*.msixupload
